name: verificar

# La puerta de las pull requests. El nombre del job de cierre «verificar» es el
# contexto que exige la protección de la rama main (infra/github.tf): si se
# renombra, hay que cambiarlo allí. Añadir jobs a este workflow es seguro;
# renombrar o quitar el job «verificar» rompe la fusión de todas las PR.
#
# Ya no se dispara en push a main: ahí corre desplegar.yml, que verifica de
# nuevo antes de tocar producción. Así cada evento ejecuta un solo pipeline.
#
# Este workflow NO lleva filtro de rutas en `on`, y no es descuido: es una
# comprobación REQUERIDA por la protección de rama. Un job saltado por un filtro
# de rutas no reporta estado, así que filtrar aquí dejaría a una PR que solo toca
# documentación esperando para siempre un check que no va a llegar. Lo que se
# salta son los BLOQUES de trabajo, con el `if` de cada job a partir de lo que
# clasifica el job `cambios`; el job de cierre corre y reporta siempre.
#
# Tampoco vale el truco del workflow espejo con un job del mismo nombre que hace
# `exit 0` en las rutas inversas: `paths` y `paths-ignore` no son complementarios
# (una PR que toca documentación Y código coincide con los dos), así que se
# crearían dos check runs llamados «verificar» y el verde falso podría tapar al
# rojo de verdad.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Qué ha cambiado de verdad. La clasificación vive en una acción compuesta y
  # no aquí para que desplegar.yml use exactamente la misma lista: dos copias se
  # separan solas, y separarse significa saltarse algo en uno de los dos sitios.
  cambios:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filtro.outputs.infra }}
      datos: ${{ steps.filtro.outputs.datos }}
      app: ${{ steps.filtro.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Historia completa: la acción compara contra la base del evento y con
          # la profundidad 1 por omisión ese commit no existe en el clon. Sin él
          # la acción no adivina, clasifica todo como relevante — seguro, pero
          # entonces el pipeline entero corre en cada PR y filtrar no serviría.
          fetch-depth: 0

      - id: filtro
        uses: ./.github/actions/clasificar-cambios

  infra:
    needs: cambios
    if: needs.cambios.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ~1.15
          terraform_wrapper: false

      - name: Comprobar formato del Terraform
        run: terraform fmt -check -recursive -diff
        working-directory: infra

      # Sin backend: validar no necesita credenciales ni acceso al estado.
      - name: Validar Terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
          cd bootstrap
          terraform init -backend=false -input=false
          terraform validate
        working-directory: infra

  # Los tests de RLS tienen su propio job y ya no van detrás del frontend: sin
  # backend, las políticas son el único perímetro de seguridad, y su fallo no
  # corrompe datos, los expone. Que este bloque corra en paralelo con el
  # frontend recupera además el tiempo que antes daba el orden secuencial.
  datos:
    needs: cambios
    if: needs.cambios.outputs.datos == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # El up ya espera a las migraciones: rest depende de migrate con
      # service_completed_successfully. No añadir `docker compose wait migrate`:
      # solo sabe esperar a contenedores corriendo, y si migrate ya terminó
      # falla con «no containers for project» (carrera vista en CI).
      - name: Levantar el stack
        run: docker compose up -d db auth migrate rest gateway

      - name: Comprobar que las migraciones se aplicaron
        run: docker compose logs migrate | grep -q "Migraciones OK"

      - name: Tests de políticas RLS y reglas del esquema
        run: make db-test

      - name: Registros del stack si algo falló
        if: failure()
        run: docker compose logs --tail=80

  frontend:
    needs: cambios
    if: needs.cambios.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: app

      - name: Comprobación de tipos
        run: npm run typecheck
        working-directory: app

      - name: Tests del frontend
        run: npm test
        working-directory: app

      - name: Compilación de producción
        run: npm run build
        working-directory: app
        env:
          VITE_SUPABASE_URL: http://localhost:8321
          VITE_SUPABASE_ANON_KEY: clave-de-compilacion-sin-uso

  # El contexto que exige la protección de rama (infra/github.tf). No lleva
  # filtro de rutas y lleva `always()`: corre y reporta SIEMPRE, también cuando
  # los tres bloques se saltan. Es lo único que evita que una PR de solo
  # documentación quede bloqueada esperando un check que no va a llegar.
  verificar:
    name: verificar
    needs: [cambios, infra, datos, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # `always()` sin comprobar los resultados convertiría este job en un sello
      # verde permanente: con `always()`, un `needs` fallido ya no tumba al job
      # que depende de él. Por eso se enumeran los resultados uno a uno.
      - name: Resultado de los bloques de verificación
        env:
          RESULTADOS: >-
            ${{ needs.cambios.result }} ${{ needs.infra.result }}
            ${{ needs.datos.result }} ${{ needs.frontend.result }}
        run: |
          set -euo pipefail
          echo "Resultados: $RESULTADOS"
          # «skipped» es un resultado válido: significa que no ha cambiado nada
          # de lo que ese bloque comprueba. Solo fallan «failure» y «cancelled».
          for r in $RESULTADOS; do
            case "$r" in
              success|skipped) ;;
              *) echo "Un bloque de verificación terminó en «$r»"; exit 1 ;;
            esac
          done
          echo "Verificación OK"

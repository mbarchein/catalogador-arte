# Complete local stack — without Supabase's CLI.
# Services: Postgres, GoTrue (auth), PostgREST (API), an nginx gateway that emulates
# Kong (/auth/v1, /rest/v1), a migration applier and a frontend with Vite.
#
#   make up     → raises everything (app :5173, API :8321, db :5433)
#   make reset  → recreates the base applying migrations and seed
#
# The published ports are DELIBERATELY below 32768, which is where
# Linux's ephemeral port range starts (see /proc/sys/net/ipv4/
# ip_local_port_range). Publishing on 54321 or 54322, as is customary in Supabase,
# makes any outgoing connection able to take the port and the
# stack fail to start with «address already in use» intermittently and
# bewilderingly. They can be changed with PUERTO_* in .env.
#
# JWT keys: Supabase self-host's public demonstration ones. LOCAL ONLY.

x-jwt: &jwt-env
  JWT_SECRET: &jwt-secret your-super-secret-jwt-token-with-at-least-32-characters-long
  ANON_KEY: &anon-key eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWxvY2FsIiwiaWF0IjoxNzM1Njg5NjAwLCJleHAiOjIwODI3NTg0MDB9.JOdqQjQ623ht1NBb6JtdPmy2iDc6S7QloNGa5YBQ4Ao
  SERVICE_ROLE_KEY: &service-key eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UtbG9jYWwiLCJpYXQiOjE3MzU2ODk2MDAsImV4cCI6MjA4Mjc1ODQwMH0.hKugUZ3psc796Vm1pvDwNp_KGtbvF22bnuyE6pjGQFk

services:
  # The SAME major version as production (PostgreSQL 17). It is not cosmetic: a
  # dump from the cloud is made with pg_dump 17 and its preamble includes SETs that do not
  # exist in 15, so `make db-load` failed against an older local one.
  # And a failure that only appears in the cloud is what a local stack exists to
  # avoid. On changing it the volume has to be recreated: `make clean && make up`.
  db:
    image: supabase/postgres:17.6.1.158
    ports:
      - "${PUERTO_DB:-5433}:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db-init.sql:/docker-entrypoint-initdb.d/zz-init-roles.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 3s
      timeout: 3s
      retries: 20

  auth:
    image: supabase/gotrue:v2.158.1
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://${DEV_HOST:-localhost}:${PUERTO_API:-8321}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres@db:5432/postgres
      GOTRUE_SITE_URL: http://${DEV_HOST:-localhost}:${PUERTO_APP:-5173}
      GOTRUE_URI_ALLOW_LIST: http://${DEV_HOST:-localhost}:${PUERTO_APP:-5173}/auth/callback,http://${DEV_HOST:-localhost}:${PUERTO_APP:-5173}/reset-password,http://${DEV_HOST:-localhost}:${PUERTO_APP:-5173}
      GOTRUE_JWT_SECRET: *jwt-secret
      GOTRUE_JWT_EXP: "43200"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      # RF-112: there is no open registration. The accounts are created by the superuser.
      # The administration API (make seed-users) does not go through this door.
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      # Local SMTP → mailpit (a test mailbox, interface on the PUERTO_CORREO port).
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_USER: ""
      GOTRUE_SMTP_PASS: ""
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@catalogador.local
      GOTRUE_SMTP_SENDER_NAME: Catalogador
      GOTRUE_SMTP_MAX_FREQUENCY: 5s
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_PASSWORD_MIN_LENGTH: "8"
      GOTRUE_MAILER_OTP_EXP: "900"
      GOTRUE_RATE_LIMIT_HEADER: X-Forwarded-For
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9999/health"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Local mailbox: it collects the invitations and the recovery emails.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${PUERTO_CORREO:-8325}:8025"

  migrate:
    image: supabase/postgres:17.6.1.158
    depends_on:
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./supabase/seed.sql:/seed.sql:ro
      - ./docker/migrate.sh:/migrate.sh:ro
    environment:
      PGHOST: db
      PGUSER: supabase_admin
      PGPASSWORD: postgres
      PGDATABASE: postgres
    entrypoint: ["bash", "/migrate.sh"]
    restart: "no"

  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: *jwt-secret
      # RF-604: the listing paginates. A hard cap prevents a filtering failure
      # in the client from fetching the whole catalogue.
      PGRST_DB_MAX_ROWS: "500"

  # Local S3 for the masters: it emulates Backblaze B2 (the same API) so as to be able
  # to test the complete signing flow without depending on an external service.
  # A public port because the URLs are signed against the browser's host: the
  # master's PUT goes straight here, not through the gateway.
  minio:
    image: minio/minio:latest
    command: server /data
    ports:
      - "${PUERTO_S3:-9100}:9000"
    environment:
      MINIO_ROOT_USER: minio-local
      MINIO_ROOT_PASSWORD: minio-local-secreto
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 4s
      timeout: 3s
      retries: 30

  # It creates the masters' bucket on starting. Idempotent.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio-local minio-local-secreto &&
      mc mb --ignore-existing local/masters-local &&
      echo 'bucket masters-local listo'"
    restart: "no"

  # Edge function for signing, in the same runtime as the cloud (Deno). It signs against
  # minio's PUBLIC endpoint: the signature covers the host, and whoever uses it is the
  # browser, which does not resolve docker's internal names.
  functions:
    image: denoland/deno:alpine
    working_dir: /functions/sign-file
    command: ["run", "--allow-net", "--allow-env", "index.ts"]
    depends_on:
      - rest
    volumes:
      - ./supabase/functions:/functions:ro
    environment:
      SUPABASE_URL: http://gateway:8000
      SUPABASE_ANON_KEY: *anon-key
      S3_ENDPOINT: http://${DEV_HOST:-localhost}:${PUERTO_S3:-9100}
      S3_REGION: local
      S3_BUCKET_MASTERS: masters-local
      S3_KEY_ID: minio-local
      S3_KEY_SECRET: minio-local-secreto

  # WebSockets for the live views (ADR-005): the same service as in the
  # cloud. Delivery respects RLS — each client receives only rows it can read.
  realtime:
    image: supabase/realtime:v2.30.23
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "4000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: supabase_admin
      DB_PASSWORD: postgres
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: *jwt-secret
      SECRET_KEY_BASE: realtimerealtimerealtimerealtimerealtimerealtimerealtime12
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"

  # File storage. It is the same service as in the cloud, not a
  # mock-up: the paths, the policies and the signed URLs behave the same, which
  # is exactly what has to be testable locally (ADR-002).
  storage:
    image: supabase/storage-api:v1.11.13
    # Before migrate, not after: on starting, storage runs ITS OWN
    # internal migrations, which bring up to date the `storage` schema that Postgres'
    # image brings (they add columns like buckets.public to it). Our
    # migrations write in that schema, so they need storage to have
    # started already. With the opposite order everything works… until the first
    # clean volume, which is exactly when nobody understands what is happening.
    depends_on:
      db:
        condition: service_healthy
    environment:
      ANON_KEY: *anon-key
      SERVICE_KEY: *service-key
      AUTH_JWT_SECRET: *jwt-secret
      PGRST_JWT_SECRET: *jwt-secret
      POSTGREST_URL: http://rest:3000
      DATABASE_URL: postgres://supabase_storage_admin:postgres@db:5432/postgres
      # 60 MB: a camera master is around 8-15 MB and a large scan can
      # go past 30. The cap exists so that an absurd file does not fill the
      # disk in one go, not to limit the normal work.
      FILE_SIZE_LIMIT: "62914560"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      GLOBAL_S3_BUCKET: stub
      # The derivatives are generated in the browser before uploading (ADR-002), so
      # the image transformation service is not needed.
      ENABLE_IMAGE_TRANSFORMATION: "false"
      DB_INSTALL_ROLES: "false"
    volumes:
      - storage_data:/var/lib/storage
    healthcheck:
      # The storage image does not bring wget or curl, but it does bring node with global fetch.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5000/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 4s
      timeout: 4s
      retries: 30

  gateway:
    image: nginx:alpine
    depends_on:
      - auth
      - rest
      - storage
      - realtime
      - functions
    ports:
      - "${PUERTO_API:-8321}:8000"
    volumes:
      - ./docker/gateway.conf:/etc/nginx/conf.d/default.conf:ro

  app:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - gateway
    volumes:
      - ./app:/app
      - app_node_modules:/app/node_modules
    ports:
      - "${PUERTO_APP:-5173}:5173"
    environment:
      # DEV_HOST: put your machine's IP on the local network (e.g. 192.168.1.50) in
      # .env in order to catalogue from the phone. The phone is the device of the main
      # use case (RNF-106), so this is not an extra: it is how it is tested.
      VITE_SUPABASE_URL: http://${DEV_HOST:-localhost}:${PUERTO_API:-8321}
      VITE_SUPABASE_ANON_KEY: *anon-key
      VITE_APP_URL: http://${DEV_HOST:-localhost}:${PUERTO_APP:-5173}

  # Preview of the production build: make preview
  app-preview:
    profiles: ["preview"]
    build:
      context: ./app
      args:
        VITE_SUPABASE_URL: http://localhost:${PUERTO_API:-8321}
        VITE_SUPABASE_ANON_KEY: *anon-key
        VITE_APP_URL: http://localhost:8080
    ports:
      - "8080:80"

volumes:
  db_data:
  app_node_modules:
  storage_data:
  minio_data:

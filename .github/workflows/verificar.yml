name: verificar

# La puerta de las pull requests. El nombre del job «verificar» es el contexto
# que exige la protección de la rama main (infra/github.tf): si se renombra,
# hay que cambiarlo allí.
#
# Ya no se dispara en push a main: ahí corre desplegar.yml, que verifica de
# nuevo antes de tocar producción. Así cada evento ejecuta un solo pipeline.
#
# Este workflow NO lleva paths-ignore, y no es descuido: es una comprobación
# REQUERIDA por la protección de rama. Si se saltara en una PR que solo toca
# documentación, el contexto «verificar» no se reportaría nunca y la PR quedaría
# bloqueada para siempre esperando a un check que no va a llegar. El paths-ignore
# vive en desplegar.yml, que no es requerido por nadie.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: verificar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Infraestructura ─────────────────────────────────────
      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~1.15
          terraform_wrapper: false

      - name: Comprobar formato del Terraform
        run: terraform fmt -check -recursive -diff
        working-directory: infra

      # Sin backend: validar no necesita credenciales ni acceso al estado.
      - name: Validar Terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
          cd bootstrap
          terraform init -backend=false -input=false
          terraform validate
        working-directory: infra

      # ── Base de datos ───────────────────────────────────────
      # Los tests de RLS van primero a propósito: sin backend, las políticas son
      # el único perímetro de seguridad, y su fallo no corrompe datos, los expone.
      # El up ya espera a las migraciones: rest depende de migrate con
      # service_completed_successfully. No añadir `docker compose wait migrate`:
      # solo sabe esperar a contenedores corriendo, y si migrate ya terminó
      # falla con «no containers for project» (carrera vista en CI).
      - name: Levantar el stack
        run: docker compose up -d db auth migrate rest gateway

      - name: Comprobar que las migraciones se aplicaron
        run: docker compose logs migrate | grep -q "Migraciones OK"

      - name: Tests de políticas RLS y reglas del esquema
        run: make db-test

      # ── Frontend ────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: app

      - name: Comprobación de tipos
        run: npm run typecheck
        working-directory: app

      - name: Tests del frontend
        run: npm test
        working-directory: app

      - name: Compilación de producción
        run: npm run build
        working-directory: app
        env:
          VITE_SUPABASE_URL: http://localhost:8321
          VITE_SUPABASE_ANON_KEY: clave-de-compilacion-sin-uso

      - name: Registros del stack si algo falló
        if: failure()
        run: docker compose logs --tail=80

# Minimal configuration for Supabase's CLI, which is used only in CI to
# apply the migrations to the cloud project (supabase db push, in
# .github/workflows/desplegar.yml).
#
# The local stack does NOT use the CLI: it runs in docker compose and applies the migrations
# with docker/migrate.sh. That is why nothing else is set here — ports, Postgres'
# version or auth settings live in docker-compose.yml for local and in
# infra/supabase.tf for the cloud, and duplicating them here would create a third copy
# that nobody would maintain.
project_id = "catalogador-arte"

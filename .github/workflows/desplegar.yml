name: desplegar

# Pipeline de despliegue: verificar → migrar la base → publicar el frontend.
#
# El orden importa y no es negociable: primero las migraciones y después el
# frontend, porque el frontend nuevo puede depender del esquema nuevo y lo
# contrario nunca. Consecuencia práctica: durante unos segundos el frontend
# viejo corre contra el esquema nuevo, así que las migraciones deben ser
# aditivas — renombrar o borrar una columna en uso exige dos despliegues
# (primero dejar de usarla, después quitarla).
#
# Este workflow queda inerte hasta el primer `terraform apply`: los secretos y
# variables que consume (SUPABASE_*, VERCEL_*) los crea infra/github.tf a
# partir de los recursos reales, no se copian a mano al panel.

on:
  push:
    branches: [main]
    # Cambios que no afectan a lo desplegado. La infraestructura se aplica a
    # mano por política (ver infra/README.md), y docker/ es el stack local.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'infra/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'Makefile'
      - 'scripts/**'
      - '.gitignore'
      - '.env.example'
  workflow_dispatch:

permissions:
  contents: read

# Un solo despliegue a la vez, y sin cancelar el que esté en marcha: matarlo a
# mitad puede dejar migraciones aplicadas con el frontend viejo publicado.
concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  # Se verifica otra vez aunque la protección de rama ya exigiera «verificar» en
  # la PR: main admite push directo del administrador (enforce_admins = false), y
  # desplegar sin verificar por esa puerta sería un agujero. Incluye los tests de
  # RLS contra una base real: son el perímetro de seguridad y por tanto la puerta
  # del despliegue, no un extra.
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: app

      - name: Comprobación de tipos
        run: npm run typecheck
        working-directory: app

      - name: Tests del frontend
        run: npm test
        working-directory: app

      # La compilación se comprueba ANTES de migrar. Si compilara mal y se
      # descubriera en «publicar», las migraciones ya estarían aplicadas y el
      # frontend viejo quedaría corriendo contra el esquema nuevo sin relevo.
      - name: Compilación de producción
        run: npm run build
        working-directory: app
        env:
          VITE_SUPABASE_URL: http://localhost:8321
          VITE_SUPABASE_ANON_KEY: clave-de-compilacion-sin-uso

      # El up ya espera a las migraciones: rest depende de migrate con
      # service_completed_successfully. No añadir `docker compose wait migrate`:
      # solo sabe esperar a contenedores corriendo, y si migrate ya terminó
      # falla con «no containers for project» (carrera vista en CI).
      - name: Levantar el stack local
        run: docker compose up -d db auth migrate rest gateway

      - name: Comprobar que las migraciones se aplicaron
        run: docker compose logs migrate | grep -q "Migraciones OK"

      - name: Tests de políticas RLS y reglas del esquema
        run: make db-test

      - name: Registros del stack si algo falló
        if: failure()
        run: docker compose logs --tail=80

  migrar:
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Vincular el proyecto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Aplica supabase/migrations/*.sql en orden, cada una una sola vez: la CLI
      # lleva su propio registro en supabase_migrations.schema_migrations, igual
      # que docker/migrate.sh lo lleva en _migraciones para el stack local.
      # seed.sql NO se ejecuta aquí: es semilla de desarrollo.
      - name: Aplicar migraciones
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Desplegar funciones Edge
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

      # Las credenciales de B2 llegan a la función por aquí, desde los secretos
      # que Terraform derivó del bucket real. Nombres S3_* a propósito: cambiar
      # de proveedor de almacenamiento es cambiar estos valores, no el código.
      - name: Configurar secretos de las funciones
        run: |
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            S3_ENDPOINT="${{ vars.S3_ENDPOINT }}" \
            S3_REGION="${{ vars.S3_REGION }}" \
            S3_BUCKET_MASTERS="${{ vars.S3_BUCKET_MASTERS }}" \
            S3_KEY_ID="${{ secrets.S3_KEY_ID }}" \
            S3_KEY_SECRET="${{ secrets.S3_KEY_SECRET }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

  publicar:
    needs: migrar
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Mismo camino que la otra aplicación del equipo, que lleva tiempo en
      # producción: `vercel build` ejecuta la compilación de Vite (el proyecto
      # tiene root_directory = app) y las VITE_* se incrustan en ese momento.
      # Vienen de las variables de Actions, que Terraform deriva de los recursos
      # reales, así que no pueden quedar desactualizadas: el proyecto de Vercel
      # no guarda ninguna variable — CI es la única fuente.
      - name: Publicar en Vercel
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_APP_URL: ${{ vars.APP_URL }}

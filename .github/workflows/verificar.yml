name: verificar

# The pull requests' gate. The name of the closing job «verificar» is the
# context the main branch's protection requires (infra/github.tf): if it is
# renamed, it has to be changed there. Adding jobs to this workflow is safe;
# renaming or removing the «verificar» job breaks the merging of every PR.
#
# It no longer fires on a push to main: there desplegar.yml runs, which verifies
# again before touching production. This way each event runs a single pipeline.
#
# This workflow carries NO path filter in `on`, and it is not an oversight: it is a
# check REQUIRED by the branch protection. A job skipped by a path
# filter reports no status, so filtering here would leave a PR that only touches
# documentation waiting for ever for a check that is not going to arrive. What is
# skipped are the BLOCKS of work, with each job's `if` from what the
# `cambios` job classifies; the closing job runs and reports always.
#
# Nor does the mirror-workflow trick work, with a job of the same name that does
# `exit 0` on the inverse paths: `paths` and `paths-ignore` are not complementary
# (a PR that touches documentation AND code matches both), so two check runs
# called «verificar» would be created and the false green could cover up the
# real red.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # What has really changed. The classification lives in a composite action and
  # not here so that desplegar.yml uses exactly the same list: two copies drift
  # apart on their own, and drifting apart means skipping something in one of the two places.
  cambios:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filtro.outputs.infra }}
      datos: ${{ steps.filtro.outputs.datos }}
      app: ${{ steps.filtro.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the action compares against the event's base and with
          # the default depth of 1 that commit does not exist in the clone. Without it
          # the action does not guess, it classifies everything as relevant — safe, but
          # then the whole pipeline runs on every PR and filtering would be of no use.
          fetch-depth: 0

      - id: filtro
        uses: ./.github/actions/clasificar-cambios

  infra:
    needs: cambios
    if: needs.cambios.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ~1.15
          terraform_wrapper: false

      - name: Comprobar formato del Terraform
        run: terraform fmt -check -recursive -diff
        working-directory: infra

      # With no backend: validating needs no credentials and no access to the state.
      - name: Validar Terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
          cd bootstrap
          terraform init -backend=false -input=false
          terraform validate
        working-directory: infra

  # The RLS tests have their own job and no longer go behind the frontend: with no
  # backend, the policies are the only security perimeter, and their failure does not
  # corrupt data, it exposes it. This block running in parallel with the
  # frontend also recovers the time the sequential order used to cost.
  datos:
    needs: cambios
    if: needs.cambios.outputs.datos == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The up already waits for the migrations: rest depends on migrate with
      # service_completed_successfully. Do not add `docker compose wait migrate`:
      # it only knows how to wait for running containers, and if migrate has already finished it
      # fails with «no containers for project» (a race seen in CI).
      - name: Levantar el stack
        run: docker compose up -d db auth migrate rest gateway

      - name: Comprobar que las migraciones se aplicaron
        run: docker compose logs migrate | grep -q "Migraciones OK"

      - name: Tests de políticas RLS y reglas del esquema
        run: make db-test

      - name: Registros del stack si algo falló
        if: failure()
        run: docker compose logs --tail=80

  frontend:
    needs: cambios
    if: needs.cambios.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: app

      - name: Comprobación de tipos
        run: npm run typecheck
        working-directory: app

      - name: Tests del frontend
        run: npm test
        working-directory: app

      - name: Compilación de producción
        run: npm run build
        working-directory: app
        env:
          VITE_SUPABASE_URL: http://localhost:8321
          VITE_SUPABASE_ANON_KEY: clave-de-compilacion-sin-uso

  # The deployment pipeline's invariants, which are code like any
  # other and already broke production once (see .github/pipeline.test.sh). With no
  # `if`: it runs on every PR, because what it checks does not depend on which files
  # have been touched and it costs seconds. It only reads files: no network, no Docker, no
  # credentials.
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tests del pipeline de despliegue
        run: ./.github/pipeline.test.sh

  # The context the branch protection requires (infra/github.tf). It carries no
  # path filter and it carries `always()`: it runs and reports ALWAYS, including when
  # the three blocks are skipped. It is the only thing that prevents a documentation-only
  # PR from being blocked waiting for a check that is not going to arrive.
  verificar:
    name: verificar
    needs: [cambios, infra, datos, frontend, pipeline]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # `always()` without checking the results would turn this job into a permanent
      # green stamp: with `always()`, a failed `needs` no longer knocks down the job
      # that depends on it. That is why the results are enumerated one by one.
      - name: Resultado de los bloques de verificación
        env:
          RESULTADOS: >-
            ${{ needs.cambios.result }} ${{ needs.infra.result }}
            ${{ needs.datos.result }} ${{ needs.frontend.result }}
            ${{ needs.pipeline.result }}
        run: |
          set -euo pipefail
          echo "Resultados: $RESULTADOS"
          # «skipped» is a valid result: it means that nothing of what that block
          # checks has changed. Only «failure» and «cancelled» fail.
          for r in $RESULTADOS; do
            case "$r" in
              success|skipped) ;;
              *) echo "Un bloque de verificación terminó en «$r»"; exit 1 ;;
            esac
          done
          echo "Verificación OK"

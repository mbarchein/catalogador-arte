# Pasarela local: emula el enrutado de Kong en Supabase.
# supabase-js espera /auth/v1 y /rest/v1 bajo una única URL. En la nube Kong
# añade las cabeceras CORS; aquí las pone nginx para auth (PostgREST ya emite
# las suyas).

server {
    listen 8000;

    location /auth/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, apikey, Content-Type, X-Client-Info, X-Supabase-Api-Version" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        proxy_pass http://auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Reenvía el host:puerto que usó el cliente (ej. localhost:54321) y no
        # el $server_port interno de nginx: GoTrue construye con esto los
        # enlaces de los correos de invitación.
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
    }

    location /storage/v1/ {
        # storage-api no responde al preflight de CORS: en la nube lo hace Kong.
        # Sin esto, el navegador manda OPTIONS antes de cada subida, recibe 404 y
        # no llega a enviar el POST — la subida falla sin dejar ni un error claro.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, apikey, Content-Type, Cache-Control, X-Client-Info, X-Upsert, X-Requested-With, Range" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, ETag" always;

        proxy_pass http://storage:5000/;
        proxy_set_header Host $host;
        # Los másters pesan decenas de MB: sin esto nginx corta la subida.
        client_max_body_size 64m;
        proxy_request_buffering off;
    }

    # Comprobación rápida para quien abra la URL base en el navegador
    location = / {
        default_type application/json;
        return 200 '{"estado":"ok","rutas":["/auth/v1","/rest/v1","/storage/v1"]}';
    }

    location / {
        return 404 '{"error":"ruta no gestionada por la pasarela local"}';
    }
}

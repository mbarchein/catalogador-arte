name: desplegar

# Pipeline de despliegue: verificar → migrar la base → publicar el frontend.
#
# El orden importa y no es negociable: primero las migraciones y después el
# frontend, porque el frontend nuevo puede depender del esquema nuevo y lo
# contrario nunca. Consecuencia práctica: durante unos segundos el frontend
# viejo corre contra el esquema nuevo, así que las migraciones deben ser
# aditivas — renombrar o borrar una columna en uso exige dos despliegues
# (primero dejar de usarla, después quitarla).
#
# Y el orden es una cadena, no una sugerencia: «publicar» exige que «migrar» haya
# terminado bien, y «migrar» corre en TODOS los despliegues verificados, no solo
# en los que traen migraciones. Ese «solo los que traen migraciones» fue un fallo
# real en producción y está contado entero en el comentario del job «migrar».
#
# Este workflow queda inerte hasta el primer `terraform apply`: los secretos y
# variables que consume (SUPABASE_*, VERCEL_*) los crea infra/github.tf a
# partir de los recursos reales, no se copian a mano al panel.

on:
  push:
    branches: [main]
    # Aquí solo va lo que no puede afectar a NADA de lo que este workflow hace:
    # ni al despliegue ni a la verificación que lo precede. Si un cambio no
    # dispara el workflow, sus jobs no llegan a evaluar ningún `if`, así que este
    # filtro es el más ancho de los dos y gana siempre: lo que se ignore aquí no
    # se verifica ni se despliega, y no hay condición que lo recupere.
    #
    # infra/** está aquí porque este workflow no ejecuta Terraform en ningún job:
    # la plataforma se aplica a mano por política (ver infra/README.md).
    #
    # Ojo con lo que YA NO está en esta lista: Makefile, docker/** y
    # docker-compose.yml. No cambian nada de lo desplegado, pero SÍ son lo que
    # ejecuta la verificación de más abajo (`make db-test` sobre el stack de
    # compose). Ignorarlos aquí significaba que un Makefile roto entraba en main
    # sin que nadie lo ejecutara — y main admite push directo del administrador
    # (enforce_admins = false) —, con el fallo apareciendo en el siguiente
    # despliegue de verdad, atribuido al commit equivocado. Ahora disparan la
    # verificación pero no el despliegue: eso lo decide el `if` de cada job.
    #
    # Una ruta nueva que nadie añada a esta lista dispara el workflow, que es el
    # lado seguro del error: cuesta minutos de CI, no se salta comprobaciones.
    #
    # `*.md` y no `**.md`: en los filtros de GitHub, `*` no cruza la barra, así
    # que esto ignora los .md de la raíz (README, CHANGELOG, CLAUDE) pero NO los
    # de app/, que el clasificador cuenta como parte del frontend. Con `**.md` un
    # push que solo cambiara un Markdown de app/ no llegaba ni a arrancar este
    # workflow, y el cambio se quedaba sin publicar sin ningún aviso. Los .md de
    # docs/ e infra/ ya entran por sus carpetas; los de docker/, por su patrón.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'infra/**'
      - 'docker/**.md'
      - 'scripts/**'
      - 'LICENSE'
      - '.gitignore'
      - '.env.example'
  # Al disparo manual no se le aplican los filtros de rutas, y la acción que
  # clasifica los cambios no tiene con qué comparar: despliega todo. Es la
  # escotilla para forzar un despliegue completo.
  workflow_dispatch:

permissions:
  contents: read

# Un solo despliegue a la vez, y sin cancelar el que esté en marcha: matarlo a
# mitad puede dejar migraciones aplicadas con el frontend viejo publicado.
concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  # Qué ha cambiado de verdad en este push. Misma acción compuesta que usa
  # verificar.yml, a propósito: si la clasificación estuviera copiada en los dos
  # ficheros, las dos copias se separarían y un workflow acabaría saltándose algo
  # que el otro comprueba. La lista de rutas y su justificación están allí.
  cambios:
    runs-on: ubuntu-latest
    outputs:
      datos: ${{ steps.filtro.outputs.datos }}
      app: ${{ steps.filtro.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Historia completa: la acción compara contra la punta anterior de la
          # rama, que con la profundidad 1 por omisión no está en el clon. Si no
          # la encuentra no adivina: clasifica todo como relevante.
          fetch-depth: 0

      - id: filtro
        uses: ./.github/actions/clasificar-cambios

  # Se verifica otra vez aunque la protección de rama ya exigiera «verificar» en
  # la PR: main admite push directo del administrador (enforce_admins = false), y
  # desplegar sin verificar por esa puerta sería un agujero. Incluye los tests de
  # RLS contra una base real: son el perímetro de seguridad y por tanto la puerta
  # del despliegue, no un extra.
  verificar:
    needs: cambios
    # Se verifica siempre que haya cambiado algo verificable, aunque no se vaya a
    # desplegar nada: es lo que hace que un cambio en el Makefile o en el stack
    # de compose no entre en main sin ejecutarse. Y este job es la única puerta de
    # «migrar», que ahora cuelga solo de él: si se salta, no se toca la base.
    if: needs.cambios.outputs.datos == 'true' || needs.cambios.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: app

      - name: Comprobación de tipos
        run: npm run typecheck
        working-directory: app

      - name: Tests del frontend
        run: npm test
        working-directory: app

      # La compilación se comprueba ANTES de migrar. Si compilara mal y se
      # descubriera en «publicar», las migraciones ya estarían aplicadas y el
      # frontend viejo quedaría corriendo contra el esquema nuevo sin relevo.
      - name: Compilación de producción
        run: npm run build
        working-directory: app
        env:
          VITE_SUPABASE_URL: http://localhost:8321
          VITE_SUPABASE_ANON_KEY: clave-de-compilacion-sin-uso

      # El up ya espera a las migraciones: rest depende de migrate con
      # service_completed_successfully. No añadir `docker compose wait migrate`:
      # solo sabe esperar a contenedores corriendo, y si migrate ya terminó
      # falla con «no containers for project» (carrera vista en CI).
      - name: Levantar el stack local
        run: docker compose up -d db auth migrate rest gateway

      - name: Comprobar que las migraciones se aplicaron
        run: docker compose logs migrate | grep -q "Migraciones OK"

      - name: Tests de políticas RLS y reglas del esquema
        run: make db-test

      - name: Registros del stack si algo falló
        if: failure()
        run: docker compose logs --tail=80

  migrar:
    needs: verificar
    # Sin status functions a propósito: si `verificar` falla o se salta, este job
    # se salta también, porque la dirección segura es no desplegar.
    #
    # Y SIN condición sobre `esquema`: este job corre en TODO despliegue
    # verificado, aunque el push no traiga ni una migración. La razón es un fallo
    # que ya ocurrió en producción:
    #
    #   1. Un push traía trece migraciones nuevas (la procedencia, la
    #      bibliografía, las exposiciones, el archivo documental...) y su
    #      `verificar` falló por un test de SQL. `migrar` se saltó, correctamente.
    #   2. Los pushes siguientes arreglaron el test y siguieron con el frontend,
    #      pero ya no tocaban supabase/migrations/, así que `esquema` era false y
    #      `migrar` se saltaba en cada uno — mientras `publicar` sí corría.
    #   3. Resultado: frontend nuevo en producción contra el esquema viejo. La
    #      usuaria veía «Could not find the table 'public.provenance_events' in
    #      the schema cache» en todos los bloques nuevos de la ficha.
    #
    # La asimetría que lo causaba: `publicar` sube el ÁRBOL entero, así que un
    # push posterior arrastra los cambios de frontend que se quedaron atrás;
    # `migrar` estaba condicionado al DIFF de un push, así que las migraciones de
    # un despliegue fallido no volvían a intentarse nunca. Solo salía de ahí un
    # `workflow_dispatch` a mano, y nadie sabe que hay que lanzarlo hasta que la
    # usuaria ve el error.
    #
    # Correrlo siempre es gratis y correcto: `supabase db push` es idempotente
    # —lleva su registro en supabase_migrations.schema_migrations y no aplica dos
    # veces la misma migración—, y sin nada pendiente son segundos. El coste
    # aceptado es el simétrico: si Supabase no responde, este job falla y
    # `publicar` no publica, así que un arreglo de solo frontend espera a que la
    # base esté accesible. Es la dirección segura: la contraria es la de arriba.
    if: needs.verificar.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Vincular el proyecto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Qué hay aplicado en producción y qué falta, ANTES de tocar nada. No
      # decide ni condiciona: se imprime para que el registro del despliegue diga
      # con qué esquema se encontró. Cuando el fallo de arriba volvió a
      # investigarse, esta lista era justo lo que no había en ningún sitio.
      - name: Migraciones pendientes en producción
        run: supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Aplica supabase/migrations/*.sql en orden, cada una una sola vez: la CLI
      # lleva su propio registro en supabase_migrations.schema_migrations, igual
      # que docker/migrate.sh lo lleva en _migraciones para el stack local.
      # seed.sql NO se ejecuta aquí: es semilla de desarrollo.
      #
      # Al no estar condicionado a que el push traiga migraciones, esto aplica
      # TODO lo que le falte a producción, venga del push de ahora o de uno
      # anterior que no llegó a desplegarse. Es la propiedad que faltaba.
      - name: Aplicar migraciones
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Tampoco condicionado, y por el mismo motivo: una función Edge cuyo push
      # se quedó sin desplegar tenía el mismo agujero que las migraciones, y
      # encima ningún job la comprueba (ver el hueco anotado en la acción que
      # clasifica los cambios). Redesplegar el mismo código es idempotente.
      - name: Desplegar funciones Edge
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

  # Los secretos de la función Edge tienen su propio job, y no un paso dentro de
  # «migrar», porque son la única cosa de este workflow cuyo valor cambia SIN que
  # cambie ningún fichero del repositorio: los deriva Terraform del bucket real
  # (infra/github.tf) y se renuevan al rotar la clave de B2. Ese `terraform apply`
  # se hace a mano y su commit solo toca infra/**, que está en el paths-ignore de
  # arriba: no dispara nada. Si este paso colgara de un job condicionado al diff
  # del push, una clave rotada no llegaría a Supabase hasta el siguiente cambio
  # de esquema, y mientras tanto la función firmaría con la credencial revocada:
  # subir másters fallaría en producción con todo el CI en verde. Por eso se
  # reempujan en TODO despliegue verificado: es idempotente y tarda segundos.
  # («migrar» ahora también corre siempre, por una versión más caro de este mismo
  # razonamiento, pero sigue teniendo su job aparte: son cosas distintas y un
  # fallo al empujar secretos no debe impedir aplicar migraciones.)
  #
  # No va delante de «migrar» ni «migrar» detrás de él a propósito: encadenarlos
  # haría que un fallo aquí se llevara por delante el despliegue del esquema, sin
  # ganar nada. Van en paralelo.
  secretos:
    needs: verificar
    if: needs.verificar.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # Las credenciales de B2 llegan a la función por aquí, desde los secretos
      # que Terraform derivó del bucket real. Nombres S3_* a propósito: cambiar
      # de proveedor de almacenamiento es cambiar estos valores, no el código.
      - name: Configurar secretos de las funciones
        run: |
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            S3_ENDPOINT="${{ vars.S3_ENDPOINT }}" \
            S3_REGION="${{ vars.S3_REGION }}" \
            S3_BUCKET_MASTERS="${{ vars.S3_BUCKET_MASTERS }}" \
            S3_KEY_ID="${{ secrets.S3_KEY_ID }}" \
            S3_KEY_SECRET="${{ secrets.S3_KEY_SECRET }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

  publicar:
    needs: [cambios, verificar, migrar]
    # Se exige que `migrar` haya terminado en `success`, y ya no se admite que se
    # haya SALTADO. Antes se admitía porque `migrar` se saltaba en los pushes que
    # solo tocaban app/, y sin ese `skipped` el frontend no se habría publicado
    # nunca; ahora `migrar` corre en todo despliegue verificado, así que solo se
    # salta cuando `verificar` no ha ido bien — caso que la condición de al lado
    # ya bloquea. Admitirlo aquí sería dejar abierta la única puerta por la que un
    # frontend nuevo puede salir a producción contra un esquema viejo.
    #
    # `!cancelled()` sigue siendo necesario: sin él, cualquier `skipped` en la
    # cadena de `needs` arrastraría a este job.
    if: >-
      !cancelled()
      && needs.verificar.result == 'success'
      && needs.migrar.result == 'success'
      && needs.cambios.outputs.app == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Mismo camino que la otra aplicación del equipo, que lleva tiempo en
      # producción: `vercel build` ejecuta la compilación de Vite (el proyecto
      # tiene root_directory = app) y las VITE_* se incrustan en ese momento.
      # Vienen de las variables de Actions, que Terraform deriva de los recursos
      # reales, así que no pueden quedar desactualizadas: el proyecto de Vercel
      # no guarda ninguna variable — CI es la única fuente.
      #
      # Al incrustarse al compilar, el valor que hay publicado es el que había
      # cuando se compiló. Y este job solo corre cuando cambia app/, así que
      # cambiar una de esas variables con `terraform apply` (por ejemplo la URL
      # de la aplicación, que va en el QR de la ficha impresa) NO se recoge en el
      # siguiente despliegue cualquiera: hay que lanzar este workflow con
      # `workflow_dispatch`, que al no tener base con la que comparar despliega
      # todo. Los secretos S3_* no dependen de esto: se reempujan siempre, en el
      # job `secretos`, precisamente porque nadie se acuerda de estas cosas.
      - name: Publicar en Vercel
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_APP_URL: ${{ vars.APP_URL }}

# Local gateway: it emulates Kong's routing in Supabase.
# supabase-js expects /auth/v1 and /rest/v1 under a single URL. In the cloud Kong
# adds the CORS headers; here nginx sets them for auth (PostgREST already emits
# its own).

server {
    listen 8000;

    location /auth/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, apikey, Content-Type, X-Client-Info, X-Supabase-Api-Version" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        proxy_pass http://auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # It forwards the host:port the client used (e.g. localhost:54321) and not
        # nginx's internal $server_port: GoTrue builds with this the
        # links of the invitation emails.
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
    }

    location /storage/v1/ {
        # storage-api does not answer the CORS preflight: in the cloud Kong does it.
        # Without this, the browser sends OPTIONS before each upload, receives 404 and
        # never gets to send the POST — the upload fails without leaving a single clear error.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, apikey, Content-Type, Cache-Control, X-Client-Info, X-Upsert, X-Requested-With, Range" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, ETag" always;

        proxy_pass http://storage:5000/;
        proxy_set_header Host $host;
        # The masters weigh tens of MB: without this nginx cuts the upload off.
        client_max_body_size 64m;
        proxy_request_buffering off;
    }

    # Edge function for signing masters. CORS here because in the cloud the
    # platform sets it and locally there is nobody else to set it.
    location /functions/v1/sign-file {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, apikey, Content-Type, X-Client-Info" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        proxy_pass http://functions:8000/;
        proxy_set_header Host $host;
    }

    # WebSockets of the live views.
    location /realtime/v1/ {
        proxy_pass http://realtime:4000/socket/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host realtime-dev.localhost;
        proxy_read_timeout 3600s;
    }

        # A quick check for whoever opens the base URL in the browser
    location = / {
        default_type application/json;
        return 200 '{"estado":"ok","rutas":["/auth/v1","/rest/v1","/storage/v1","/realtime/v1","/functions/v1/sign-file"]}';
    }

    location / {
        return 404 '{"error":"ruta no gestionada por la pasarela local"}';
    }
}

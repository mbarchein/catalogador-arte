name: Clasificar cambios
description: >-
  Decide qué bloques del pipeline hay que ejecutar según los ficheros que ha
  tocado el evento. Fuente única de esa clasificación para los dos workflows.

# Why this lives in a composite action and is not copied into each workflow: two
# copies of a list of paths drift apart on their own, and drifting apart means that
# one workflow skips something the other does not. With a single copy, the list is changed
# in one place; and as it is under .github/, touching it fires the whole pipeline
# (see the `.github/*` pattern further below), so the change exercises itself.
#
# It requires the repository to be already checked out with enough history to
# compare against the event's base: `actions/checkout` with `fetch-depth: 0`.
# If the base is not available, this action does NOT guess: it classifies everything as
# relevant and says so in the log.

outputs:
  infra:
    description: Hay que verificar el Terraform de infra/
    value: ${{ steps.filtro.outputs.infra }}
  datos:
    description: Hay que ejecutar los tests de SQL contra el stack local
    value: ${{ steps.filtro.outputs.datos }}
  app:
    description: Hay que verificar (y publicar) el frontend de app/
    value: ${{ steps.filtro.outputs.app }}

# There used to be an `esquema` output here («there is something that is DEPLOYED to Supabase») that
# conditioned desplegar.yml's «migrar» job. It was removed because classifying by
# the diff of ONE push is the wrong question for what is deployed to the
# base: if that push never gets deployed, its migrations are never
# retried, and the following pushes —which no longer touch the migrations—
# publish a new frontend against the old schema. It happened, and the user saw it as
# «Could not find the table ... in the schema cache». Now «migrar» runs
# always and `supabase db push` applies whatever is missing, which is idempotent and does not
# need to know what changed. The long story is in desplegar.yml.

runs:
  using: composite
  steps:
    - name: Clasificar los ficheros cambiados
      id: filtro
      shell: bash
      env:
        EVENTO: ${{ github.event_name }}
        # The branch's previous tip on a push. On a branch's first push it
        # arrives as zeros, and after a force-push it may point at a commit that no
        # longer exists: both cases fall into the «verify everything» hatch.
        ANTES: ${{ github.event.before }}
      run: |
        set -euo pipefail

        infra=false; datos=false; app=false
        todo() { infra=true; datos=true; app=true; }

        case "$EVENTO" in
          pull_request)
            # On a pull request, HEAD is the merge commit GitHub prepares
            # and HEAD^1 is the base branch's tip, so this diff is
            # exactly «what the PR changes with respect to main».
            base="HEAD^1"; cabeza="HEAD" ;;
          push)
            base="$ANTES"; cabeza="$GITHUB_SHA" ;;
          *)
            # workflow_dispatch and any other event with no base: there is nothing
            # to compare with. It is besides the hatch for forcing the complete
            # pipeline by hand.
            base=""; cabeza="" ;;
        esac

        # The list of paths goes to a temporary file separated by null bytes, and
        # not to a variable separated by newlines, for two reasons:
        #
        #  - `git diff --name-only` WITHOUT `-z` quotes and escapes the paths it
        #    considers odd. With `core.quotepath` at its default value (true,
        #    and GitHub's runners do not change it) that includes EVERY non-ASCII
        #    character: `docs/ubicación.md` comes out as `"docs/ubicaci\303\263n.md"`,
        #    which matches neither `docs/*` nor `*.md` and would fall into the
        #    «unclassified» wildcard, firing the whole pipeline over a documentation
        #    file. In a repository whose documentation is in Spanish,
        #    that is the most likely file name. With `-z`
        #    git emits the raw path, unquoted, and incidentally a name with spaces,
        #    quotes or newlines stops being a problem.
        #  - To a file and not to `$(...)`: bash's command substitution
        #    DISCARDS the null bytes (it warns and carries on), so
        #    `ficheros=$(git diff -z ...)` would glue all the paths into a single
        #    string and any change of more than one file would also fall into the
        #    wildcard.
        lista="$(mktemp)"

        motivo=""
        if [ -z "$base" ] || [ -z "$cabeza" ]; then
          motivo="el evento «$EVENTO» no trae una base con la que comparar"
        elif ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
          motivo="la base «$base» no está en el clon (¿fetch-depth insuficiente, force-push o primer push de la rama?)"
        elif ! git diff -z --name-only "$base" "$cabeza" >"$lista"; then
          motivo="git diff contra «$base» ha fallado"
        fi

        if [ -n "$motivo" ]; then
          # The safe direction: if it is not known what has changed, everything is verified.
          # Getting it wrong here costs minutes of CI; getting it wrong the other way skips
          # the RLS policy tests, which are this project's only security
          # perimeter.
          echo "Sin lista de cambios fiable: $motivo"
          echo "Se verifica TODO."
          todo
        else
          echo "Ficheros cambiados:"
          tr '\0' '\n' <"$lista"

          while IFS= read -r -d '' f; do
            [ -n "$f" ] || continue
            case "$f" in
              # All of app/ and not only app/src/: package-lock.json is the cache's
              # key and `npm ci`'s input, and vite.config.ts also defines
              # the tests' environment. The Dockerfile and nginx.conf are used only by
              # `make preview`, but firing too much is the good side of the error.
              #
              # This branch goes BEFORE the one for the irrelevant files, and it is not
              # cosmetic: `case` keeps the FIRST match, so
              # with `*.md` in front an `app/public/nota.md` would be classified as
              # irrelevant. Today there is no .md under app/ and the build reads
              # none, but the day the application imports a Markdown the
              # failure would be silent: the change would not be published and nobody would
              # find out. With app/ in front, an .md from app/ compiles and publishes too
              # much, which is the side of the error this design accepts.
              app/*) app=true ;;

              # Lo que la aplicación IMPORTA desde fuera de app/. Hoy es uno:
              # `CHANGELOG.md`, que se empotra en el build con `?raw` y es lo que se
              # lee en «Acerca de · Novedades».
              #
              # Estaba clasificado como documentación por el `*.md` de abajo, así que un
              # cambio solo en el registro **no se publicaba y nadie se enteraba**: es
              # exactamente el fallo silencioso que el comentario de arriba predijo el día
              # que la aplicación importara un Markdown. Pasó, y se vio como «en Novedades
              # no aparece lo último».
              #
              # Va ANTES del `*.md` porque `case` se queda con la PRIMERA rama que
              # coincide. Y hay un test que saca esta lista del propio código —los
              # ficheros de fuera de app/ que la aplicación importa— y comprueba que
              # cada uno cae aquí, para que el siguiente no vuelva a colarse.
              CHANGELOG.md) app=true ;;

              # Nothing CI runs reads these files. The READMEs of
              # infra/ and docker/ come in through `*.md` even though they live next to
              # code: they are documentation. `scripts/generar-iconos.py` generates
              # PNGs that are already versioned (app/public/icons/), and CI never
              # runs it; what does matter is its output, which falls in app/.
              docs/*|*.md|LICENSE|.gitignore|.env.example|scripts/*) ;;

              # The platform's Terraform: only format and validity are checked.
              # It is not applied from CI (it is applied by hand, see infra/README.md).
              infra/*) infra=true ;;

              # Everything under supabase/ activates the SQL tests, and what is
              # deployed is no longer distinguished from what is only verified: what
              # goes to Supabase —migrations and Edge functions— is deployed on EVERY
              # verified push, without asking about the diff (see «migrar» in
              # desplegar.yml). The SQL tests and seed.sql are not deployed, but
              # an output for that was not needed either.
              #
              # A known gap, earlier than this filter and not fixed here:
              # supabase/functions/ is deployed but no job checks it —
              # there is no `deno check` and the compose stack does not raise the
              # `functions` service. When there is one, it is a new block with its own
              # output, not a patch on this branch.
              #
              # What else falls here and runs or holds up the SQL tests: the
              # tests themselves, the seed, the compose stack and the Makefile.
              # The Makefile goes here because `make db-test` is WHAT RUNS the
              # RLS tests (the loop, the ON_ERROR_STOP=1 and the `|| exit 1` that
              # makes a red test knock down the pipeline): if it changes, it has to be
              # checked that they are still being run, because a broken Makefile is a
              # green pipeline that proves nothing. And docker/migrate.sh prints
              # the «Migraciones OK» that both workflows look for with grep, so
              # touching it can break CI without touching a single policy.
              supabase/*|docker/*|docker-compose.yml|Makefile) datos=true ;;

              # Changing the pipeline (the workflows or this very action) fires the
              # whole pipeline, itself included.
              .github/*) todo ;;

              # An unclassified path: EVERYTHING is verified. This branch is the design's
              # safety net, not an oversight. If a new folder appears tomorrow
              # and nobody adds it to the lists above, the verification is NOT
              # skipped: it fires whole until somebody
              # decides which block it belongs to. Adding a new folder here is
              # an explicit decision, forgetting it only costs minutes of CI.
              *)
                echo "  → «$f» no está clasificado: se verifica TODO"
                todo ;;
            esac
            # A redirection and not a pipe: a pipe runs the loop in a
            # subshell and the variables would go back to false on finishing.
          done <"$lista"
        fi

        {
          echo "infra=$infra"
          echo "datos=$datos"
          echo "app=$app"
        } >> "$GITHUB_OUTPUT"

        echo "→ infra=$infra datos=$datos app=$app"

# Stack local completo — sin la CLI de Supabase.
# Servicios: Postgres, GoTrue (auth), PostgREST (API), pasarela nginx que emula
# Kong (/auth/v1, /rest/v1), aplicador de migraciones y frontend con Vite.
#
#   make up     → levanta todo (app :5173, API :8321, db :5433)
#   make reset  → recrea la base aplicando migraciones y semilla
#
# Los puertos publicados están DELIBERADAMENTE por debajo de 32768, que es donde
# empieza el rango de puertos efímeros de Linux (ver /proc/sys/net/ipv4/
# ip_local_port_range). Publicar en 54321 o 54322, como es costumbre en Supabase,
# hace que cualquier conexión saliente pueda quedarse con el puerto y que el
# stack falle al arrancar con «address already in use» de forma intermitente y
# desconcertante. Se pueden cambiar con PUERTO_* en .env.
#
# Claves JWT: las públicas de demostración de Supabase self-host. SOLO LOCAL.

x-jwt: &jwt-env
  JWT_SECRET: &jwt-secret your-super-secret-jwt-token-with-at-least-32-characters-long
  ANON_KEY: &anon-key eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWxvY2FsIiwiaWF0IjoxNzM1Njg5NjAwLCJleHAiOjIwODI3NTg0MDB9.JOdqQjQ623ht1NBb6JtdPmy2iDc6S7QloNGa5YBQ4Ao
  SERVICE_ROLE_KEY: &service-key eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UtbG9jYWwiLCJpYXQiOjE3MzU2ODk2MDAsImV4cCI6MjA4Mjc1ODQwMH0.hKugUZ3psc796Vm1pvDwNp_KGtbvF22bnuyE6pjGQFk

services:
  db:
    image: supabase/postgres:15.8.1.085
    ports:
      - "${PUERTO_DB:-5433}:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db-init.sql:/docker-entrypoint-initdb.d/zz-init-roles.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 3s
      timeout: 3s
      retries: 20

  auth:
    image: supabase/gotrue:v2.158.1
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://${DEV_HOST:-localhost}:${PUERTO_API:-8321}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres@db:5432/postgres
      GOTRUE_SITE_URL: http://${DEV_HOST:-localhost}:${PUERTO_APP:-5173}
      GOTRUE_URI_ALLOW_LIST: http://${DEV_HOST:-localhost}:${PUERTO_APP:-5173}/auth/callback,http://${DEV_HOST:-localhost}:${PUERTO_APP:-5173}/reset-password,http://${DEV_HOST:-localhost}:${PUERTO_APP:-5173}
      GOTRUE_JWT_SECRET: *jwt-secret
      GOTRUE_JWT_EXP: "43200"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      # RF-112: no hay registro abierto. Las cuentas las crea el superusuario.
      # La API de administración (make seed-users) no pasa por esta puerta.
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      # SMTP local → mailpit (buzón de pruebas, interfaz en el puerto PUERTO_CORREO).
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_USER: ""
      GOTRUE_SMTP_PASS: ""
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@catalogador.local
      GOTRUE_SMTP_SENDER_NAME: Catalogador
      GOTRUE_SMTP_MAX_FREQUENCY: 5s
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_PASSWORD_MIN_LENGTH: "8"
      GOTRUE_MAILER_OTP_EXP: "900"
      GOTRUE_RATE_LIMIT_HEADER: X-Forwarded-For
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9999/health"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Buzón local: recoge las invitaciones y los correos de recuperación.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${PUERTO_CORREO:-8325}:8025"

  migrate:
    image: supabase/postgres:15.8.1.085
    depends_on:
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./supabase/seed.sql:/seed.sql:ro
      - ./docker/migrate.sh:/migrate.sh:ro
    environment:
      PGHOST: db
      PGUSER: supabase_admin
      PGPASSWORD: postgres
      PGDATABASE: postgres
    entrypoint: ["bash", "/migrate.sh"]
    restart: "no"

  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: *jwt-secret
      # RF-604: el listado pagina. Un tope duro evita que un fallo de filtrado
      # en el cliente se traiga el catálogo entero.
      PGRST_DB_MAX_ROWS: "500"

  # Almacenamiento de ficheros. Es el mismo servicio que en la nube, no un
  # simulacro: las rutas, las políticas y las URL firmadas se comportan igual, que
  # es justo lo que hay que poder probar en local (ADR-002).
  storage:
    image: supabase/storage-api:v1.11.13
    # Antes de migrate, no después: al arrancar, storage ejecuta SUS PROPIAS
    # migraciones internas, que ponen al día el esquema `storage` que trae la
    # imagen de Postgres (le añaden columnas como buckets.public). Nuestras
    # migraciones escriben en ese esquema, así que necesitan que storage haya
    # arrancado ya. Con el orden contrario todo funciona… hasta el primer
    # volumen limpio, que es exactamente cuando nadie entiende qué pasa.
    depends_on:
      db:
        condition: service_healthy
    environment:
      ANON_KEY: *anon-key
      SERVICE_KEY: *service-key
      AUTH_JWT_SECRET: *jwt-secret
      PGRST_JWT_SECRET: *jwt-secret
      POSTGREST_URL: http://rest:3000
      DATABASE_URL: postgres://supabase_storage_admin:postgres@db:5432/postgres
      # 60 MB: un máster de cámara ronda los 8-15 MB y un escaneo grande puede
      # pasar de 30. El tope existe para que un fichero disparatado no llene el
      # disco de un tirón, no para limitar el trabajo normal.
      FILE_SIZE_LIMIT: "62914560"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      GLOBAL_S3_BUCKET: stub
      # Las derivadas se generan en el navegador antes de subir (ADR-002), así que
      # no hace falta el servicio de transformación de imágenes.
      ENABLE_IMAGE_TRANSFORMATION: "false"
      DB_INSTALL_ROLES: "false"
    volumes:
      - storage_data:/var/lib/storage
    healthcheck:
      # La imagen de storage no trae wget ni curl, pero sí node con fetch global.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5000/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 4s
      timeout: 4s
      retries: 30

  gateway:
    image: nginx:alpine
    depends_on:
      - auth
      - rest
      - storage
    ports:
      - "${PUERTO_API:-8321}:8000"
    volumes:
      - ./docker/gateway.conf:/etc/nginx/conf.d/default.conf:ro

  app:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - gateway
    volumes:
      - ./app:/app
      - app_node_modules:/app/node_modules
    ports:
      - "${PUERTO_APP:-5173}:5173"
    environment:
      # DEV_HOST: pon la IP de tu máquina en la red local (ej. 192.168.0.11) en
      # .env para catalogar desde el móvil. El móvil es el dispositivo del caso
      # de uso principal (RNF-106), así que esto no es un extra: es como se prueba.
      VITE_SUPABASE_URL: http://${DEV_HOST:-localhost}:${PUERTO_API:-8321}
      VITE_SUPABASE_ANON_KEY: *anon-key
      VITE_APP_URL: http://${DEV_HOST:-localhost}:${PUERTO_APP:-5173}

  # Vista previa de la compilación de producción: make preview
  app-preview:
    profiles: ["preview"]
    build:
      context: ./app
      args:
        VITE_SUPABASE_URL: http://localhost:${PUERTO_API:-8321}
        VITE_SUPABASE_ANON_KEY: *anon-key
        VITE_APP_URL: http://localhost:8080
    ports:
      - "8080:80"

volumes:
  db_data:
  app_node_modules:
  storage_data:

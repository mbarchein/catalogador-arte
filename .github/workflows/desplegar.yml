name: desplegar

# Deployment pipeline: verify → migrate the base → publish the frontend.
#
# The order matters and is not negotiable: the migrations first and the frontend
# afterwards, because the new frontend may depend on the new schema and the
# opposite never. A practical consequence: for a few seconds the old frontend
# runs against the new schema, so the migrations must be
# additive — renaming or deleting a column in use requires two deployments
# (first stop using it, then remove it).
#
# And the order is a chain, not a suggestion: «publicar» requires that «migrar» have
# finished well, and «migrar» runs on ALL verified deployments, not only
# on those that bring migrations. That «only those that bring migrations» was a real
# failure in production and it is told in full in the «migrar» job's comment.
#
# This workflow stays inert until the first `terraform apply`: the secrets and
# variables it consumes (SUPABASE_*, VERCEL_*) are created by infra/github.tf from
# the real resources, they are not copied by hand into the panel.

on:
  push:
    branches: [main]
    # Only what cannot affect ANYTHING this workflow does goes here:
    # neither the deployment nor the verification that precedes it. If a change does not
    # fire the workflow, its jobs never get to evaluate any `if`, so this
    # filter is the wider of the two and always wins: what is ignored here is
    # neither verified nor deployed, and there is no condition that recovers it.
    #
    # infra/** is here because this workflow does not run Terraform in any job:
    # the platform is applied by hand as a matter of policy (see infra/README.md).
    #
    # Mind what is NO LONGER on this list: Makefile, docker/** and
    # docker-compose.yml. They change nothing of what is deployed, but they ARE what
    # runs the verification further below (`make db-test` over the compose
    # stack). Ignoring them here meant that a broken Makefile got into main
    # with nobody running it — and main admits a direct push from the administrator
    # (enforce_admins = false) —, with the failure appearing in the next
    # real deployment, attributed to the wrong commit. Now they fire the
    # verification but not the deployment: that is decided by each job's `if`.
    #
    # A new path nobody adds to this list fires the workflow, which is the
    # safe side of the error: it costs minutes of CI, it does not skip checks.
    #
    # LOS .md DE LA RAÍZ SE ENUMERAN, y no se ignoran con `*.md`. La razón es un
    # incidente: `CHANGELOG.md` **se empotra en el build** —«Acerca de · Novedades» lo
    # lee con `?raw`—, así que un cambio solo en el registro no llegaba nunca a
    # producción. Y aquí no había forma de notarlo: este filtro es el más ancho de los
    # dos, y lo que ignora no dispara el workflow, así que no hubo ni un job saltado
    # que mirar. Se vio como «en Novedades no sale lo último».
    #
    # `paths-ignore` no tiene «excepto», así que la lista de los que SÍ se ignoran se
    # escribe entera. Un .md nuevo en la raíz dispara el workflow —el lado bueno del
    # error— hasta que alguien decida si la aplicación lo lee.
    #
    # Y `*` no cruza la barra en los filtros de GitHub, así que esto no toca los .md de
    # app/, que el clasificador cuenta como frontend: con `**.md`, un push que solo
    # cambiara un Markdown de app/ no llegaba ni a arrancar. Los de docs/ e infra/
    # entran por sus carpetas; los de docker/, por su patrón.
    paths-ignore:
      - 'README.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - 'infra/**'
      - 'docker/**.md'
      - 'scripts/**'
      # La página comercial, que tiene su propio workflow y su propio destino
      # (GitHub Pages). No comparte una sola línea con lo que se despliega: retocar
      # una frase del escaparate no puede migrar la base ni republicar la aplicación.
      - 'site/**'
      - 'LICENSE'
      - '.gitignore'
      - '.env.example'
  # Path filters do not apply to a manual trigger, and the action that
  # classifies the changes has nothing to compare with: it deploys everything. It is the
  # hatch for forcing a complete deployment.
  workflow_dispatch:

permissions:
  contents: read

# A single deployment at a time, and without cancelling whichever is under way: killing it
# half way can leave migrations applied with the old frontend published.
concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

# THE SUPABASE CLI VERSION IS PINNED. It is repeated in the two jobs that
# install it —«migrar» and «secretos»— because an `env:` in the header would require
# interpolating it in the step's `with:`, and this cannot be tested without deploying.
# That both say the same thing is checked by `.github/pipeline.test.sh`, so
# raising it half way does not reach main.
#
# It was on `latest`, and that means that every deployment premières the version
# published since the previous one. On 7 August 2026 2.112.0 came out at
# 10:08 and at 10:13 the deployment failed at the first step:
#
#   failed to get api keys: SchemaError(Expected a string matching the RegExp
#   ^…T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$ at [2]["inserted_at"])
#
# It was nothing of this repository's. That version added a run-time
# check over the timestamps Supabase's management API returns
# —up to 2.111.0 the field was an unvalidated string— and the API itself
# returns one that does not satisfy it. With `supabase link` failing, the «migrar» job did not
# start, and as «publicar» requires a green «migrar», nothing was deployed.
#
# `latest`'s cost is this: a deployment that has passed all the verification
# falls over because of something published outside the repository while it was running. Raising it
# is a deliberate and reviewable change, like any other dependency.
#
# TO RAISE IT: change BOTH `version:` at once and check that `supabase
# link` works with the new version. The failure above will be fixed in the CLI
# or in the API; until it is known which, the only check is to launch it.

jobs:
  # What has really changed in this push. The same composite action verificar.yml
  # uses, on purpose: if the classification were copied in both
  # files, the two copies would drift apart and one workflow would end up skipping something
  # the other checks. The list of paths and its justification are there.
  cambios:
    runs-on: ubuntu-latest
    outputs:
      datos: ${{ steps.filtro.outputs.datos }}
      app: ${{ steps.filtro.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the action compares against the branch's previous tip,
          # which with the default depth of 1 is not in the clone. If it does not
          # find it, it does not guess: it classifies everything as relevant.
          fetch-depth: 0

      - id: filtro
        uses: ./.github/actions/clasificar-cambios

  # It is verified again even though the branch protection already required «verificar» in
  # the PR: main admits a direct push from the administrator (enforce_admins = false), and
  # deploying without verifying through that door would be a hole. It includes the RLS
  # tests against a real base: they are the security perimeter and therefore the deployment's
  # gate, not an extra.
  verificar:
    needs: cambios
    # It is verified whenever something verifiable has changed, even if nothing is going to
    # be deployed: it is what makes a change to the Makefile or to the compose
    # stack not get into main without being run. And this job is the only gate of
    # «migrar», which now hangs from it alone: if it is skipped, the base is not touched.
    if: needs.cambios.outputs.datos == 'true' || needs.cambios.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # First and with no dependencies: the pipeline's own invariants, which are
      # what prevents publishing a frontend against an unmigrated schema. If this
      # fails, nothing that comes afterwards matters. See .github/pipeline.test.sh.
      - name: Tests del pipeline de despliegue
        run: ./.github/pipeline.test.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: app

      - name: Comprobación de tipos
        run: npm run typecheck
        working-directory: app

      - name: Tests del frontend
        run: npm test
        working-directory: app

      # The build is checked BEFORE migrating. If it built badly and it were
      # discovered in «publicar», the migrations would already be applied and the
      # old frontend would be left running against the new schema with no relief.
      - name: Compilación de producción
        run: npm run build
        working-directory: app
        env:
          VITE_SUPABASE_URL: http://localhost:8321
          VITE_SUPABASE_ANON_KEY: clave-de-compilacion-sin-uso

      # The up already waits for the migrations: rest depends on migrate with
      # service_completed_successfully. Do not add `docker compose wait migrate`:
      # it only knows how to wait for running containers, and if migrate has already finished it
      # fails with «no containers for project» (a race seen in CI).
      - name: Levantar el stack local
        run: docker compose up -d db auth migrate rest gateway

      - name: Comprobar que las migraciones se aplicaron
        run: docker compose logs migrate | grep -q "Migraciones OK"

      - name: Tests de políticas RLS y reglas del esquema
        run: make db-test

      - name: Registros del stack si algo falló
        if: failure()
        run: docker compose logs --tail=80

  migrar:
    needs: verificar
    # With no status functions on purpose: if `verificar` fails or is skipped, this job
    # is skipped too, because the safe direction is not to deploy.
    #
    # And WITH NO condition on `esquema`: this job runs on EVERY verified
    # deployment, even if the push does not bring a single migration. The reason is a failure
    # that already occurred in production:
    #
    #   1. A push brought thirteen new migrations (the provenance, the
    #      bibliography, the exhibitions, the documentary archive...) and its
    #      `verificar` failed because of a SQL test. `migrar` was skipped, correctly.
    #   2. The following pushes fixed the test and carried on with the frontend,
    #      but they no longer touched supabase/migrations/, so `esquema` was false and
    #      `migrar` was skipped on each one — while `publicar` did run.
    #   3. Result: a new frontend in production against the old schema. The
    #      user saw «Could not find the table 'public.provenance_events' in
    #      the schema cache» in all the record's new blocks.
    #
    # The asymmetry that caused it: `publicar` uploads the whole TREE, so a
    # later push drags along the frontend changes that were left behind;
    # `migrar` was conditioned on the DIFF of one push, so the migrations of
    # a failed deployment were never retried. The only way out of there was a
    # `workflow_dispatch` by hand, and nobody knows it has to be launched until the
    # user sees the error.
    #
    # Running it always is free and correct: `supabase db push` is idempotent
    # —it keeps its record in supabase_migrations.schema_migrations and does not apply the
    # same migration twice—, and with nothing pending it is seconds. The accepted
    # cost is the symmetric one: if Supabase does not answer, this job fails and
    # `publicar` does not publish, so a frontend-only fix waits until the
    # base is reachable. It is the safe direction: the opposite one is the one above.
    if: needs.verificar.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A pinned version, not «latest»: the reason is in the file's header.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - name: Vincular el proyecto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # What is applied in production and what is missing, BEFORE touching anything. It
      # decides nothing and conditions nothing: it is printed so that the deployment's log says
      # which schema it found. When the failure above was
      # investigated again, this list was exactly what was nowhere to be found.
      - name: Migraciones pendientes en producción
        run: supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # It applies supabase/migrations/*.sql in order, each one only once: the CLI
      # keeps its own record in supabase_migrations.schema_migrations, just
      # as docker/migrate.sh keeps it in _migraciones for the local stack.
      # seed.sql is NOT run here: it is a development seed.
      #
      # As it is not conditioned on the push bringing migrations, this applies
      # EVERYTHING production is missing, whether it comes from the current push or from an
      # earlier one that never got deployed. It is the property that was missing.
      - name: Aplicar migraciones
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Also unconditioned, and for the same reason: an Edge function whose push
      # was left undeployed had the same hole as the migrations, and
      # on top of that no job checks it (see the gap noted in the action that
      # classifies the changes). Redeploying the same code is idempotent.
      - name: Desplegar funciones Edge
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

  # The Edge function's secrets have their own job, and not a step inside
  # «migrar», because they are the only thing in this workflow whose value changes WITHOUT
  # any file of the repository changing: Terraform derives them from the real bucket
  # (infra/github.tf) and they are renewed on rotating the B2 key. That `terraform apply`
  # is done by hand and its commit only touches infra/**, which is in the paths-ignore
  # above: it fires nothing. If this step hung from a job conditioned on the push's
  # diff, a rotated key would not reach Supabase until the next schema
  # change, and meanwhile the function would sign with the revoked credential:
  # uploading masters would fail in production with all the CI green. That is why
  # they are re-pushed on EVERY verified deployment: it is idempotent and takes seconds.
  # («migrar» now also runs always, by a more expensive version of this same
  # reasoning, but it still has its own separate job: they are different things and a
  # failure in pushing secrets must not prevent applying migrations.)
  #
  # It does not go before «migrar» nor «migrar» behind it on purpose: chaining them
  # would make a failure here take the schema's deployment down with it, without
  # gaining anything. They go in parallel.
  secretos:
    needs: verificar
    if: needs.verificar.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The same version as «migrar», and for the same reason: both jobs speak
      # with the same management API, so one's breakdown is the other's.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      # The B2 credentials reach the function through here, from the secrets
      # Terraform derived from the real bucket. S3_* names on purpose: changing
      # storage provider is changing these values, not the code.
      - name: Configurar secretos de las funciones
        run: |
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            S3_ENDPOINT="${{ vars.S3_ENDPOINT }}" \
            S3_REGION="${{ vars.S3_REGION }}" \
            S3_BUCKET_MASTERS="${{ vars.S3_BUCKET_MASTERS }}" \
            S3_KEY_ID="${{ secrets.S3_KEY_ID }}" \
            S3_KEY_SECRET="${{ secrets.S3_KEY_SECRET }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

  publicar:
    needs: [cambios, verificar, migrar]
    # It is required that `migrar` have finished in `success`, and it is no longer admitted that it have been
    # SKIPPED. It used to be admitted because `migrar` was skipped on the pushes that
    # only touched app/, and without that `skipped` the frontend would never have been
    # published; now `migrar` runs on every verified deployment, so it is only
    # skipped when `verificar` has not gone well — a case the condition alongside
    # already blocks. Admitting it here would be leaving open the only door through which a
    # new frontend can go out to production against an old schema.
    #
    # `!cancelled()` is still necessary: without it, any `skipped` in the
    # `needs` chain would drag this job along.
    if: >-
      !cancelled()
      && needs.verificar.result == 'success'
      && needs.migrar.result == 'success'
      && needs.cambios.outputs.app == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The same route as the team's other application, which has been in
      # production for a while: `vercel build` runs Vite's build (the project
      # has root_directory = app) and the VITE_* are embedded at that moment.
      # They come from the Actions variables, which Terraform derives from the real
      # resources, so they cannot get out of date: the Vercel project
      # stores no variable — CI is the only source.
      #
      # As they are embedded on building, the value that is published is the one that was there
      # when it was built. And this job only runs when app/ changes, so
      # changing one of those variables with `terraform apply` (for example the URL
      # of the application, which goes in the printed record's QR) is NOT picked up in the
      # next deployment of any kind: this workflow has to be launched with
      # `workflow_dispatch`, which having no base to compare with deploys
      # everything. The S3_* secrets do not depend on this: they are re-pushed always, in the
      # `secretos` job, precisely because nobody remembers these things.
      - name: Publicar en Vercel
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_APP_URL: ${{ vars.APP_URL }}

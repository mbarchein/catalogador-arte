server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The service worker is not cached: if it were served from cache, a new
    # deployment would never reach the devices that already have the app installed.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    # The resources with a hash in their name are cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # A single-page application: any unknown route is resolved by the
    # client's router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

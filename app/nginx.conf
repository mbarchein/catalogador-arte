server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # El service worker no se cachea: si se sirviera de caché, un despliegue
    # nuevo no llegaría nunca a los dispositivos que ya tienen la app instalada.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    # Los recursos con hash en el nombre sí se cachean de forma agresiva.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Aplicación de una sola página: cualquier ruta desconocida la resuelve el
    # enrutador del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
